format_version = 1
id = "python.functions"
version = 1
title = "Functions and your first tests"
track = "python"
order = 3
skills = ["python.functions.define", "python.functions.return", "python.testing.assert"]
prerequisites = ["python.types"]
objectives = [
  "Define a function with def and a parameter",
  "Return a value instead of printing it",
  "Write simple tests with assert",
]
risk = "runs_learner_code"
workdir = "python/03-functions"
estimated_minutes = 20
verifier = "python.functions.v1"
demonstration = """
```python
def double(n):          # define a function named double with one parameter n
    return n * 2        # send a value back to whoever called it

assert double(3) == 6   # a test: nothing happens if True, error if False
```
"""
prediction = "If a function uses `print` instead of `return`, what does `x = f()` store in x?"
prediction_answer = "None"
instructions = """
In `~/cli-mentor-workspace/python/03-functions/`:

1. In `greet.py`, write `greet(name)` that RETURNS `"Hello, <name>!"`
   (for example greet("Ada") returns "Hello, Ada!").
2. In `test_greet.py`, write at least two `assert` lines that call `greet`.
3. Run your tests: `python3 test_greet.py` (no output means they passed).
4. Type `/check`. (This check runs your code.)
"""
solution = "def greet(name):\n    return f\"Hello, {name}!\""
rubric = ["greet defined with one parameter", "Returns the right string", "2+ asserts", "Tests pass"]
transfer = [
  "Why is returning usually more useful than printing inside a function?",
  "Write a test that would catch a missing exclamation mark.",
]

[[vocabulary]]
term = "function"
meaning = "A named, reusable block of code."

[[vocabulary]]
term = "parameter"
meaning = "A name in the def line that receives the value passed in."

[[vocabulary]]
term = "return"
meaning = "Ends the function and hands a value back to the caller."

[[vocabulary]]
term = "assert"
meaning = "Checks that something is True; stops with AssertionError if it is not."

[[syntax]]
example = "def greet(name):"
parts = [
  { token = "def", meaning = "define a new function" },
  { token = "greet", meaning = "the function's name" },
  { token = "(name)", meaning = "one parameter called name" },
  { token = ":", meaning = "the indented block below is the function's body" },
]

[[syntax]]
example = "assert greet(\"Ada\") == \"Hello, Ada!\""
parts = [
  { token = "assert", meaning = "check the following is True" },
  { token = "greet(\"Ada\")", meaning = "call the function with the text Ada" },
  { token = "==", meaning = "is equal to (comparison, not assignment)" },
  { token = "\"Hello, Ada!\"", meaning = "the value we expect" },
]
note = "Indentation (4 spaces) is part of Python's syntax. It shows which lines belong to the function."

[[setup]]
path = "greet.py"
content = """
# Write a function greet(name) that returns "Hello, <name>!"
"""

[[setup]]
path = "test_greet.py"
content = """
from greet import greet

# Write at least two assert lines that call greet(...)
"""

[[hints]]
level = 1
text = "Start with `def greet(name):` and indent the next line by 4 spaces."

[[hints]]
level = 2
text = "Use `return` with an f-string: the result should be built from the word Hello, the name, and an exclamation mark."

[[hints]]
level = 3
text = "`return f\"Hello, {name}!\"`. In the test file: `assert greet(\"Ada\") == \"Hello, Ada!\"`."
