format_version = 1
id = "cli.pipelines"
version = 1
title = "Count the errors: pipes and redirects"
track = "cli"
order = 3
skills = ["cli.text.grep", "cli.text.wc", "cli.pipes.pipe", "cli.pipes.redirect"]
prerequisites = ["cli.navigation"]
objectives = [
  "Find lines that contain a word (grep)",
  "Count lines (wc -l)",
  "Send one command's output into another (|)",
  "Save output into a file (>)",
]
risk = "writes_workspace"
workdir = "cli/03-pipelines"
estimated_minutes = 15
verifier = "cli.pipelines.v1"
demonstration = """
```
$ grep cat pets.txt          # print only lines that contain "cat"
my cat is orange
the cat sleeps
$ grep cat pets.txt | wc -l  # count those lines
       2
$ grep cat pets.txt | wc -l > cats.txt   # save the count in a file
$ cat cats.txt
       2
```
"""
prediction = "If the input to `wc -l` has 3 lines, what number does it print?"
prediction_answer = "3"
instructions = """
Work in `~/cli-mentor-workspace/cli/03-pipelines`. There is a file `server.log`.

1. Look at it first: `cat server.log` (or `head server.log` for the first 10 lines).
2. Using ONE command line with a pipe `|` and a redirect `>`, write the number of
   lines that contain `ERROR` into a new file called `error_count.txt`.
3. Check it with `cat error_count.txt`, then type `/check`.
"""
solution = "grep ERROR server.log | wc -l > error_count.txt"
rubric = ["Correct count in error_count.txt", "Observed a pipeline with a redirect"]
transfer = [
  "How would you count the WARN lines instead?",
  "What would happen if you used >> instead of >?",
]

[[vocabulary]]
term = "standard output"
meaning = "Where a command writes its normal results. By default: your screen."

[[vocabulary]]
term = "pipe"
meaning = "The | symbol. It sends the standard output of the left command into the right command."

[[vocabulary]]
term = "redirect"
meaning = "The > symbol. It sends standard output into a file instead of the screen. It replaces the file's contents."

[[vocabulary]]
term = "grep"
meaning = "Prints only the lines that contain a pattern."

[[vocabulary]]
term = "wc"
meaning = "word count. With -l it counts lines."

[[syntax]]
example = "grep ERROR server.log | wc -l > error_count.txt"
parts = [
  { token = "grep", meaning = "search command" },
  { token = "ERROR", meaning = "the pattern to look for (capital letters matter)" },
  { token = "server.log", meaning = "the file to search" },
  { token = "|", meaning = "pipe: hand grep's output lines to the next command" },
  { token = "wc", meaning = "the counting command" },
  { token = "-l", meaning = "flag: count lines only" },
  { token = ">", meaning = "redirect: write the result into a file (replacing it)" },
  { token = "error_count.txt", meaning = "the file that receives the number" },
]
note = "Read it left to right like a factory line: search, then count, then save."

[[setup]]
path = "server.log"
generator = "log_lines"
generator_params = { seed = 42, lines = 60 }

[[hints]]
level = 1
text = "Break it into steps. First make a command that prints only the ERROR lines. Run it and look at the result."

[[hints]]
level = 2
text = "`grep ERROR server.log` prints the lines. Now send those lines into `wc -l` with a pipe `|`."

[[hints]]
level = 3
text = "Add `> error_count.txt` at the end: `grep ERROR server.log | wc -l > error_count.txt`."

[verifier_params]
log = "server.log"
output = "error_count.txt"
word = "ERROR"
