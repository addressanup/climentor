format_version = 1
id = "nvim.modes"
version = 1
title = "Insert, escape, save: Neovim modes"
track = "nvim"
order = 1
skills = ["nvim.modes.insert", "nvim.modes.normal", "nvim.cmdline.write"]
prerequisites = []
objectives = [
  "Know that Neovim has modes, and which one you are in",
  "Enter Insert mode to type text (o, i)",
  "Return to Normal mode (Esc)",
  "Save with :w",
]
risk = "writes_workspace"
workdir = "nvim/01-modes"
estimated_minutes = 10
verifier = "nvim.modes.v1"
demonstration = """
In Normal mode, keys are *commands*, not text. Watch the bottom-left corner:
it shows `-- INSERT --` while you are in Insert mode.

```
o                      ← opens a new line below and enters Insert mode
I can switch modes.    ← now your keys type text
Esc                    ← back to Normal mode
:w  Enter              ← write (save) the file
```
"""
prediction = "You are in Normal mode and press the key `x`. Does an x appear in the text, or does something else happen?"
prediction_answer = "Something else: in Normal mode x deletes the character under the cursor."
instructions = """
1. In the editor pane (top right) open the file. Press Esc first, then type:
   `:e ~/cli-mentor-workspace/nvim/01-modes/modes.txt` and press Enter.
2. Press `o` to open a new line and enter Insert mode.
3. Type exactly: `I can switch modes.`
4. Press `Esc` to go back to Normal mode.
5. Type `:w` and press Enter to save.

Then type `/check` in the tutor pane.
"""
solution = "o I can switch modes. <Esc> :w<Enter>"
rubric = ["Line present in saved file", "Buffer saved", "Insert then Normal mode observed"]
transfer = [
  "What is the difference between `i` and `o`?",
  "How can you tell which mode you are in?",
]

[[vocabulary]]
term = "mode"
meaning = "A state of the editor that decides what your keys do."

[[vocabulary]]
term = "Normal mode"
meaning = "The default mode. Keys are commands: move, delete, change. You start here."

[[vocabulary]]
term = "Insert mode"
meaning = "Keys type text, like a normal editor. Shown as -- INSERT -- at the bottom."

[[vocabulary]]
term = "Esc"
meaning = "The Escape key. Leaves Insert mode and returns to Normal mode."

[[vocabulary]]
term = "Command-line mode"
meaning = "Entered by typing : in Normal mode. You type a command at the bottom and press Enter."

[[vocabulary]]
term = "buffer"
meaning = "Neovim's in-memory copy of a file. Changes live here until you save."

[[syntax]]
example = ":w"
parts = [
  { token = ":", meaning = "enter Command-line mode (only works from Normal mode)" },
  { token = "w", meaning = "write: save the buffer to the file on disk" },
]

[[syntax]]
example = ":e path/to/file"
parts = [
  { token = ":", meaning = "enter Command-line mode" },
  { token = "e", meaning = "edit: open a file in this window" },
  { token = "path/to/file", meaning = "which file to open" },
]

[[syntax]]
example = "o"
parts = [{ token = "o", meaning = "open a new line below the cursor and switch to Insert mode" }]

[[setup]]
path = "modes.txt"
content = "# Practice file for Neovim modes\n"

[[hints]]
level = 1
text = "Look at the bottom-left of the editor. If it says -- INSERT --, your keys type text. Esc always takes you back to Normal mode."

[[hints]]
level = 2
text = "Order matters: o (start typing), type the sentence, Esc (stop typing), then :w and Enter (save)."

[[hints]]
level = 3
text = "Press Esc twice to be safe, then: o, type `I can switch modes.`, Esc, :w, Enter."

[verifier_params]
file = "modes.txt"
line = "I can switch modes."
